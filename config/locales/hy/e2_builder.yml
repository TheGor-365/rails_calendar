    empty: "Ընտրեք տարբերակ, փոխանցեք որոշումը կամ ավելացրեք նշում։"
    long: "Նկարագրությունը գերազանցում է 1200 նիշը։ Կրճատեք ընտրանքները կամ նշումները։"
    composed: "Նկարագրությունը կազմված է տեղային եղանակով։ Ստուգեք այն նախքան հրավերը ստեղծելը։"
