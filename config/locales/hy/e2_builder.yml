hy:
  e2_builder:
    title: "Նախնական առաջադրանքի կազմում ընտրանքներով"
    hint: "Ընտրեք աշխատանքները, տեխնոլոգիաներն ու տեղակայումը։ Բաժինները պարտադիր չեն․ որոշումը կարելի է թողնել հաճախորդին կամ կատարողին։ Տեղային անվճար ձևանմուշը կլրացնի ստորև բերված նկարագրությունը։"
    client_decides: "Հաճախորդի հայեցողությամբ"
    owner_decides: "Կատարողի հայեցողությամբ"
    notes: "Լրացուցիչ մանրամասներ (ոչ պարտադիր)"
