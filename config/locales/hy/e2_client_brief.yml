hy:
  e2_client_brief:
    title: "Ի՞նչ արդյունք եք ուզում ստանալ"
    intro: "Պարտադիր չէ հասկանալ տեխնոլոգիաները։ Ընտրեք հասկանալի տարբերակները, մնացածը թողեք մասնագետին կամ փոփոխեք առաջարկը։ Տեխնիկական անվանումները պահպանված են՝ պարզ բացատրություններով։"
    groups:
      tasks: "Ի՞նչ պետք է փոխվի"
      frontend: "Ինչ են տեսնում և օգտագործում այցելուները"
      backend: "Ինչպես է կայքն աշխատում ներսում"
      deployment: "Ինչպես կայքը հասանելի դարձնել համացանցում"
    group_help:
      tasks: "Ընտրեք ցանկալի գործնական արդյունքը։"
      frontend: "Նշեք կայքի այն մասերը, որոնք պետք է բարելավել։"
      backend: "Տեխնիկական իրականացումը կարող եք վստահել ծրագրավորողին։"
      deployment: "Հոսթինգը կայքի աշխատանքի վայրն է, իսկ տեղակայումը՝ այն համացանցում գործարկելը։"
    uncertain: "Ո՞վ պետք է որոշի մանրամասները"
    notes: "Ի՞նչն է ևս կարևոր"
    notes_placeholder: "Նկարագրեք ցանկալի արդյունքը ձեր բառերով։ Ոչ պարտադիր։"
    no_auto_ai: "Ընտրանքները պահպանվում են որպես ստուգման ենթակա սևագիր։ AI չի գործարկվում, և որևէ պայմանավորվածություն ինքնաբերաբար չի հաստատվում։"
    invalid: "Որոշ տեխնիկական ընտրանքներ չեն աջակցվում։ Ստուգեք և կրկին փորձեք։"
    long_notes: "Լրացուցիչ մանրամասները չպետք է գերազանցեն 350 նիշը։"
    explain:
      bugfix: "Կայքում ինչ-որ բան չի աշխատում կամ սխալ է աշխատում։"
      forms: "Տվյալների մուտքագրման, պահպանման և կառավարման էկրաններ։"
      api: "Երկու ծառայությունների միջև տվյալների անվտանգ փոխանակում։"
      tests: "Արդյունքի ստուգում և սխալների կրկնության կանխարգելում։"
      ui: "Կայքի հարմարավետություն, տեսք և աշխատանք հեռախոսում։"
      automation: "Կրկնվող ձեռքով քայլերի ավտոմատացում։"
      html: "Էջերի կառուցվածք, ձևանմուշներ և ձևավորում։"
      bootstrap: "Պատրաստի տարրեր ինտերֆեյսի դասավորման համար։"
      stimulus: "Էջերի ինտերակտիվություն՝ առանց ամբողջ կայքը վերակառուցելու։"
      javascript: "Կոճակների, ձևերի և էջերի վարքագիծը դիտարկիչում։"
      vite: "Դիտարկչի համար կոդի և ֆայլերի պատրաստում։"
      vue: "Ինտերակտիվ էկրանների ստեղծման գործիք։"
      ruby: "Սերվերի տրամաբանության ծրագրավորման լեզու։"
      rails: "Ruby-ի վրա կառուցված վեբ հավելվածի հենք։"
      postgresql: "Տվյալների բազա՝ տեղեկության պահպանման համար։"
      redis: "Արագ պահոց ժամանակավոր տվյալների և հերթերի համար։"
      railway: "Հավելվածը համացանցում տեղակայելու ծառայություն։"
      vps: "Վարձակալված սերվեր հավելվածը գործարկելու համար։"
      docker: "Հավելվածի և միջավայրի վերարտադրելի փաթեթ։"
      github_actions: "Կոդի ավտոմատ ստուգում և հրապարակում։"
      dns_ssl: "Կայքի հասցեի միացում և անվտանգ կապ։"
