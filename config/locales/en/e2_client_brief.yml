en:
  e2_client_brief:
    title: "What would you like to achieve?"
    intro: "You do not need to know these technologies. Select what you recognize, leave the rest to the specialist, or change the proposal. The names stay visible, with a plain explanation of each."
    groups:
      tasks: "What needs to change?"
      frontend: "What visitors see and use"
      backend: "How the website works behind the scenes"
      deployment: "Making the website available online"
    group_help:
      tasks: "Choose the practical result you need."
      frontend: "Select any visible part you want improved."
      backend: "You can leave technical implementation to the developer."
      deployment: "Hosting means the place where a website runs; deployment means putting it online."
    uncertain: "Who should decide the details?"
    notes: "Anything else we should know?"
    notes_placeholder: "Describe the result in your own words. Optional."
    no_auto_ai: "Your choices are saved as a draft for review. No AI is called and nothing is agreed automatically."
    invalid: "Some technical selections are not supported. Review them and try again."
    long_notes: "Additional details must be 350 characters or less."
    explain:
      bugfix: "Something on your current site fails or behaves incorrectly."
      forms: "Collect information, save it, or manage records through a screen."
      api: "Let two systems exchange information securely."
      tests: "Check that the result works and stays working after changes."
      ui: "Make the site understandable, attractive and usable on phones."
      automation: "Replace repetitive manual steps with a reliable process."
      html: "The structure and appearance of pages; HTML, templates and styles."
      bootstrap: "A ready-made set of interface layout and component tools."
      stimulus: "Make pages interactive without rebuilding the entire website."
      javascript: "Code that adds interactive behavior in the browser."
      vite: "Build and deliver browser-side code and assets."
      vue: "A framework for more interactive screens and applications."
      ruby: "The programming language used by parts of the server."
      rails: "The Ruby framework used to build and manage the web application."
      postgresql: "The database where the application saves structured information."
      redis: "A fast store for temporary data, queues or caching."
      railway: "A hosting service that runs the application online."
      vps: "A rented server where the application can run."
      docker: "A repeatable package of the app and its dependencies."
      github_actions: "Automated checks and delivery steps when code changes."
      dns_ssl: "Connect the domain name and secure access to the site."
