default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>

development:
  url: <%= Rails.env.development? ? ENV.fetch("RC_LOCAL_DEV_DATABASE_URL") : nil %>

test:
  url: <%= Rails.env.test? ? ENV.fetch("RC_LOCAL_TEST_DATABASE_URL") : nil %>

# Production must receive an explicit managed DATABASE_URL. No local database
# fallback, passwords, or developer PGHOST values are used automatically.
production:
  url: <%= ENV["DATABASE_URL"] %>
