default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>

development:
  <<: *default
  database: ruby_calendar

test:
  <<: *default
  database: ruby_calendar_test

# Never fall back to a local database in production. Require an explicit
# deploy-managed DATABASE_URL (and review migrations/backups before deploying).
production:
  url: <%= ENV["DATABASE_URL"] %>
