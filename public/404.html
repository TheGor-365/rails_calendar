<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>404 — Page not found · Rails Calendar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <style>
:root{color-scheme:light;--ink:#152b35;--muted:#647884;--accent:#0a766d;--ground:#f8fafb;--line:#e8eef0;--paper:#fff}
*{box-sizing:border-box}
html{min-width:320px;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
body{min-height:100vh;margin:0;color:var(--ink);background:var(--ground);display:flex;flex-direction:column}
a{color:var(--accent)}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.header{background:var(--paper);box-shadow:0 1px 0 #e8eef0}
.header-inner{max-width:1024px;margin:auto;display:flex;align-items:center;gap:12px;padding:17px clamp(20px,5vw,44px);font-size:15px;font-weight:750;letter-spacing:-.02em}
.brand{width:36px;height:36px;flex-shrink:0}
main{flex:1;max-width:1024px;width:100%;margin:auto;padding:clamp(32px,8vw,100px) clamp(20px,5vw,44px)}
.panel{padding:clamp(24px,6vw,58px);border:0;border-radius:24px;background:var(--paper);box-shadow:0 18px 40px -34px #152b355c}
.eyebrow{margin:0 0 14px;font-weight:750;font-size:12px;letter-spacing:.13em;color:var(--accent)}
h1{font-size:clamp(30px,5.6vw,52px);letter-spacing:-.055em;line-height:1.1;margin:0 0 20px;max-width:670px}
.lead{font-size:clamp(16px,2vw,19px);max-width:620px;margin:0 0 14px}
.note{color:var(--muted);font-size:14px;max-width:620px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:35px}
.action{display:inline-flex;min-height:44px;align-items:center;justify-content:center;text-decoration:none;border-radius:13px;padding:10px 18px;font-size:14px;font-weight:700}
.action-primary{background:var(--accent);color:white}.action-primary:hover{background:#07574f}
.action-secondary{border:1px solid var(--line);color:var(--ink);background:#fff}.action-secondary:hover{background:var(--ground)}
footer{max-width:1024px;width:100%;margin:auto;padding:18px clamp(20px,5vw,44px) 32px;color:var(--muted);font-size:12px}
@media(max-width:360px){.panel{padding:22px 18px}.action{width:100%}}
</style>
</head>
<body>
  <header class="header"><div class="header-inner"><svg class="brand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="15" fill="#152b35"/><rect x="13" y="16" width="38" height="34" rx="6" fill="#fff"/><rect x="13" y="16" width="38" height="12" rx="6" fill="#0a766d"/><rect x="13" y="24" width="38" height="5" fill="#0a766d"/><path d="M23 11v11M41 11v11" stroke="#a9eed9" stroke-width="4" stroke-linecap="round"/><circle cx="23" cy="37" r="2.7" fill="#b5cbc5"/><path d="m30 38 5 5 9-11" fill="none" stroke="#0a766d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Rails Calendar <span style="font-weight:400;color:var(--muted)">/ AI Service Workspace</span></span></div></header>
  <main id="main-content"><section class="panel" aria-labelledby="error-title">
    <p class="eyebrow">WORKSPACE / ERROR 404</p>
    <h1 id="error-title">Page not found</h1>
    <p class="lead">This page is unavailable. Check the address or return to the workspace.</p>
    <p class="note">This link may have moved or may not be accessible to you.</p>
    <nav class="actions" aria-label="Recovery navigation">
      <a class="action action-primary" href="/">Return home</a>
      <a class="action action-secondary" href="/sign_in">Sign in</a>
    </nav>
  </section></main>
  <footer>Rails Calendar · AI Service Workspace</footer>
</body>
</html>
