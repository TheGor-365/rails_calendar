name: Rails Calendar CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruby_calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RC_LOCAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ruby_calendar_test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies and build assets
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn build
          yarn build:css

      - name: Verify read-only staging restore preflight (offline)
        run: |
          bash -n bin/rc-staging-restore-preflight
          bash -n test/scripts/rc_staging_restore_preflight_test.sh
          bash test/scripts/rc_staging_restore_preflight_test.sh
          bash -n script/rc0551f_c21_backup_preflight.sh
          bash -n test/scripts/rc0551f_c21_backup_preflight_test.sh
          bash test/scripts/rc0551f_c21_backup_preflight_test.sh
          bash -n script/rc0551f_c21_backup_and_verify.sh
          bash -n test/scripts/rc0551f_c21_backup_and_verify_test.sh
          bash test/scripts/rc0551f_c21_backup_and_verify_test.sh
          bash -n script/rc0551f_c21a_migrate_scratch_only.sh
          bash -n test/scripts/rc0551f_c21a_migrate_scratch_only_test.sh
          bash test/scripts/rc0551f_c21a_migrate_scratch_only_test.sh
          bash -n script/rc0551f_c21c_local_grok_server.sh
          if env -u RAILS_ENV -u RACK_ENV -u DATABASE_URL -u RC_LOCAL_DEV_DATABASE_URL bash script/rc0551f_c21c_local_grok_server.sh >/tmp/rc_c21c_guard.log 2>&1; then
            echo 'FAIL: C2.1c launcher should refuse missing explicit database URL' >&2
            exit 1
          fi
          grep -q 'STOP: Explicit RC_LOCAL_DEV_DATABASE_URL required' /tmp/rc_c21c_guard.log

      - name: Prepare isolated test DB
        run: bin/rails db:prepare

      - name: Run model and controller tests
        run: bin/rails test

      - uses: browser-actions/setup-chrome@v2
        id: browser
        with:
          # TEMP: Capybara 3.40 sends origin='*' in Storage.clearDataForOrigin
          # during session reset. Chrome 158 rejects the wildcard URI; all
          # 46 browser tests fail before UI assertions. Keep the last
          # previously passing isolated CI browser until a compatible fix.
          chrome-version: '157.0.8103.78'
          install-chromedriver: true

      - name: Configure matching ChromeDriver
        run: |
          echo "$(dirname "${{ steps.browser.outputs.chromedriver-path }}")" >> "$GITHUB_PATH"
          echo "WD_CHROME_PATH=${{ steps.browser.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Run browser system tests
        run: bin/rails test:system

  # Railway uses PostgreSQL 18, while the existing test job exercises PG15.
  # Validate a clean PG18 migration path without touching Railway/production data.
  postgres18-schema:
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruby_calendar_pg18_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RC_LOCAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ruby_calendar_pg18_compat

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Verify fresh Rails migrations on Railway PostgreSQL major
        run: |
          bin/rails db:migrate
          bin/rails db:abort_if_pending_migrations
          bin/rails runner '
            db = ActiveRecord::Base.connection
            major = db.select_value("SHOW server_version_num").to_i / 10_000
            abort("Expected PostgreSQL 18, got #{major}") unless major == 18
            required = %w[
              users workspaces professional_profiles ai_spend_entries
              owner_ai_conversations owner_ai_messages
              service_offerings service_offering_versions
              active_storage_blobs active_storage_attachments
            ]
            absent = required.reject { |name| db.data_source_exists?(name) }
            abort("Missing schema tables: #{absent.join(", ")}") if absent.any?
            puts "PG18_NEW_DATABASE_MIGRATIONS_PASS"
          '
