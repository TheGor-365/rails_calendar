name: Rails Calendar tests (RC-003)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruby_calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install JS dependencies and build assets
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build
          yarn build:css
      - name: Prepare isolated test DB
        run: bin/rails db:prepare
      - name: Check eager loading and model/controller tests
        run: |
          bin/rails zeitwerk:check
          bin/rails test
      - uses: browser-actions/setup-chrome@v2
        id: browser
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Configure Chrome and ChromeDriver for Selenium
        run: |
          echo "CI_CHROMEDRIVER_PATH=${{ steps.browser.outputs.chromedriver-path }}" >> "$GITHUB_ENV"
          echo "CI_CHROME_PATH=${{ steps.browser.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Run browser system tests
        run: bin/rails test:system
