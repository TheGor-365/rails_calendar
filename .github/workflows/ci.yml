name: Rails Calendar CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruby_calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RC_LOCAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ruby_calendar_test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies and build assets
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn build
          yarn build:css

      - name: Verify read-only staging restore preflight (offline)
        run: |
          bash -n bin/rc-staging-restore-preflight
          bash -n test/scripts/rc_staging_restore_preflight_test.sh
          bash test/scripts/rc_staging_restore_preflight_test.sh

      - name: Prepare isolated test DB
        run: bin/rails db:prepare

      - name: Run model and controller tests
        run: bin/rails test

      - name: Verify standalone RC-036 synthetic local smoke command
        run: bin/rc036-local-smoke

      - uses: browser-actions/setup-chrome@v2
        id: browser
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Configure matching ChromeDriver
        run: |
          echo "$(dirname "${{ steps.browser.outputs.chromedriver-path }}")" >> "$GITHUB_PATH"
          echo "WD_CHROME_PATH=${{ steps.browser.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Run browser system tests
        run: bin/rails test:system
