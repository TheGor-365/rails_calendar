# Temporary lock regeneration only. Remove after committing the resolved files.
name: RC-003 refresh dependency lockfiles

on:
  pull_request:
    branches:
      - feature/rc-002-admin-access-2026-11-06

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve Puma with a supported patched release
        run: |
          bundle lock --update puma
          bundle install
          echo "RC003_GEMLOCK_BEGIN"
          base64 -w0 Gemfile.lock
          echo ""
          echo "RC003_GEMLOCK_END"
      - name: Refresh Sass transitive dependencies in Yarn classic lock
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn upgrade sass
          echo "RC003_YARNLOCK_BEGIN"
          base64 -w0 yarn.lock
          echo ""
          echo "RC003_YARNLOCK_END"
          yarn audit --level high
