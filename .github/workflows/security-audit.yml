name: Rails Calendar Security Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruby-gem-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Scan Ruby dependencies against ruby-advisory-db
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update --verbose

  static-analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Scan Rails code using Brakeman
        run: |
          gem install brakeman --no-document
          brakeman --no-pager --exit-on-warn

  javascript-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan locked npm/Yarn dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn audit --json > /tmp/rails_calendar_yarn_audit.jsonl || true
          node - <<'NODE'
          const fs = require("node:fs");
          const rows = fs.readFileSync("/tmp/rails_calendar_yarn_audit.jsonl", "utf8").split("\n");
          let summary = null;
          const issues = [];
          for (const line of rows) {
            if (!line.trim()) continue;
            let obj;
            try { obj = JSON.parse(line); } catch (_) { continue; }
            if (obj.type === "auditSummary") summary = obj.data.vulnerabilities;
            if (obj.type === "auditAdvisory" && obj.data && obj.data.advisory) {
              const a = obj.data.advisory;
              issues.push({ severity: a.severity, name: a.module_name, title: a.title });
            }
          }
          if (!summary || typeof summary.high !== "number" || typeof summary.critical !== "number") {
            console.error("Yarn audit did not return a valid summary; fail closed.");
            process.exit(2);
          }
          console.log("Yarn audit summary:", JSON.stringify(summary));
          for (const x of issues) console.log(`[${x.severity}] ${x.name}: ${x.title}`);
          if (summary.high + summary.critical > 0) {
            console.error("High/critical vulnerabilities detected; block this PR.");
            process.exit(1);
          }
          console.log("High/critical dependency advisory gate passed; review low/moderate separately.");
          NODE
