name: Rails Calendar Security Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruby-gem-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Scan Ruby dependencies against ruby-advisory-db
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update --verbose

  static-analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Scan Rails code using Brakeman
        run: |
          gem install brakeman --no-document
          brakeman --no-pager --exit-on-warn

  javascript-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan locked npm/Yarn dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn audit --level high
